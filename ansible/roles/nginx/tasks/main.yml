---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Install application reverse proxy
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/aws-health-app
    mode: "0644"
  notify: Reload nginx

- name: Enable application site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/aws-health-app
    dest: /etc/nginx/sites-enabled/aws-health-app
    state: link

- name: Remove default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable Nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started
