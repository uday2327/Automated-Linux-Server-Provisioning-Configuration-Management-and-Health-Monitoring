---
- name: Install Grafana prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - software-properties-common
      - wget
    state: present

- name: Download Grafana key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /tmp/grafana.gpg.key
    mode: "0644"

- name: Add Grafana repository key
  ansible.builtin.command: gpg --dearmor --yes --output /usr/share/keyrings/grafana.gpg /tmp/grafana.gpg.key
  args:
    creates: /usr/share/keyrings/grafana.gpg

- name: Add Grafana repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/grafana.list
    mode: "0644"
    content: "deb [signed-by=/usr/share/keyrings/grafana.gpg] https://apt.grafana.com stable main\n"

- name: Install Grafana
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true

- name: Create Grafana provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /var/lib/grafana/dashboards

- name: Provision Prometheus datasource
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../monitoring/grafana/provisioning/datasources/prometheus.yml"
    dest: /etc/grafana/provisioning/datasources/prometheus.yml
    mode: "0644"
  notify: Restart grafana

- name: Provision dashboards
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../monitoring/grafana/provisioning/dashboards/dashboard.yml"
    dest: /etc/grafana/provisioning/dashboards/dashboard.yml
    mode: "0644"
  notify: Restart grafana

- name: Provision system dashboard
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../monitoring/grafana/provisioning/dashboards/system-health.json"
    dest: /var/lib/grafana/dashboards/system-health.json
    mode: "0644"
  notify: Restart grafana

- name: Enable and start Grafana
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started
