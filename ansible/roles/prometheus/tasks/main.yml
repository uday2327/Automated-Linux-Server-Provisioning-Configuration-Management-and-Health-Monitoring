---
- name: Install Prometheus
  ansible.builtin.apt:
    name: prometheus
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install Prometheus scrape configuration
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../monitoring/prometheus/prometheus.yml.j2"
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: root
    mode: "0644"
  notify:
    - Validate Prometheus configuration
    - Validate Prometheus rules
    - Restart Prometheus

- name: Install Prometheus alert rules
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../monitoring/prometheus/alert_rules.yml"
    dest: /etc/prometheus/alert_rules.yml
    owner: root
    group: root
    mode: "0644"
  notify:
    - Validate Prometheus configuration
    - Restart Prometheus

- name: Enable and start Prometheus
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
