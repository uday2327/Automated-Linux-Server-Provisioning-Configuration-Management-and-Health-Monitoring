---
- name: Refresh apt package index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - jq
      - openssh-server
      - unzip
      - wget
    state: present

- name: Ensure SSH starts on boot
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started
