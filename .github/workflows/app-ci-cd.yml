name: Application CI and Approval-Gated Deployment

on:
  pull_request:
    paths:
      - "app/**"
      - "docker/**"
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "docker/**"

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: app
      - run: npm test
        working-directory: app
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/aws-health-app:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/aws-health-app:latest

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ghcr.io/${{ github.repository_owner }}/aws-health-app:${{ github.sha }}
          WEB_SSH_HOST: ${{ secrets.WEB_SSH_HOST }}
          WEB_SSH_USER: ${{ secrets.WEB_SSH_USER }}
        with:
          host: ${{ secrets.WEB_SSH_HOST }}
          username: ${{ secrets.WEB_SSH_USER }}
          key: ${{ secrets.WEB_SSH_PRIVATE_KEY }}
          envs: APP_IMAGE
          script: |
            cd /opt/aws-health-app
            sed -i "s#ghcr.io/OWNER/aws-health-app:TAG#${APP_IMAGE}#g" docker-compose.yml
            docker compose pull
            docker compose up -d --remove-orphans
            for attempt in 1 2 3 4 5 6; do
              curl --fail --silent --max-time 5 http://127.0.0.1/health && exit 0
              sleep "$((attempt * 2))"
            done
            exit 1

