name: Ansible and Configuration Validation

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  ansible:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ansible/ansible.cfg
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible validation tools
        run: |
          python3 -m pip install --user ansible-core==2.16.14 ansible-lint==24.12.2 PyYAML==6.0.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Lint and check Ansible syntax
        run: |
          ansible-lint ansible
          for playbook in ansible/playbooks/*.yml; do
            ansible-playbook -i ansible/inventory/hosts.ini.example "$playbook" --syntax-check
          done
      - name: Parse YAML and check shell scripts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path('.').rglob('*')):
              if path.is_file() and path.suffix in {'.yml', '.yaml'} and '.git' not in path.parts:
                  with path.open(encoding='utf-8') as stream:
                      list(yaml.safe_load_all(stream))
                  print(f"YAML OK: {path}")
          PY
          for script in scripts/*.sh; do bash -n "$script"; done
