name: Protected AWS Deployment

on:
  workflow_dispatch:
    inputs:
      app_image:
        description: Immutable ghcr.io image reference, such as a SHA-tagged image
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [[ -z "$AWS_ROLE_ARN" ]]; then
            echo "Required GitHub production environment variable is missing: AWS_ROLE_ARN"
            exit 1
          fi

      - name: Diagnose GitHub OIDC subject
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS -G \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=sts.amazonaws.com" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")

          TOKEN=$(jq -r '.value' <<< "$RESPONSE")

          TOKEN="$TOKEN" python3 -c '
          import os, json, base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          subject = claims.get("sub", "")
          print("OIDC subject length:", len(subject))
          print("OIDC subject:", subject)
          '

          unset TOKEN RESPONSE

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: gha-deploy
          role-skip-session-tagging: true

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Validate requested immutable image
        env:
          APP_IMAGE: ${{ inputs.app_image }}
        run: |
          set -euo pipefail
          if [[ ! "$APP_IMAGE" =~ ^ghcr\.io/uday2327/aws-health-app@sha256:[0-9a-f]{64}$ ]] &&
             [[ ! "$APP_IMAGE" =~ ^ghcr\.io/uday2327/aws-health-app:[0-9a-f]{40,64}$ ]]; then
            echo "APP_IMAGE must be a digest or 40-64 character lowercase SHA tag for ghcr.io/uday2327/aws-health-app."
            exit 1
          fi
          echo "Requested image: $APP_IMAGE"

      - name: Install deployment tools
        run: |
          set -euo pipefail
          python3 -m pip install --user ansible-core==2.16.14
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Deploy application with existing Ansible SSH inventory
        env:
          APP_IMAGE: ${{ inputs.app_image }}
        run: |
          set -euo pipefail
          ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook \
            -i ansible/inventory/hosts.ini \
            ansible/playbooks/site.yml \
            -e "app_image=$APP_IMAGE"

      - name: Verify application health
        env:
          WEB_INSTANCE_ID: ${{ vars.WEB_INSTANCE_ID }}
          AWS_REGION: us-east-1
        run: |
          set -euo pipefail

          if [[ -z "${WEB_INSTANCE_ID:-}" ]]; then
            echo "::error::WEB_INSTANCE_ID is missing."
            exit 1
          fi

          state=$(aws ec2 describe-instances \
            --instance-ids "$WEB_INSTANCE_ID" \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)

          web_ip=$(aws ec2 describe-instances \
            --instance-ids "$WEB_INSTANCE_ID" \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          if [[ "$state" != "running" || -z "$web_ip" || "$web_ip" == "None" ]]; then
            echo "::error::Web EC2 is not running or has no public IP."
            exit 1
          fi

          echo "Checking application at http://$web_ip/health"

          curl --fail --silent --show-error \
            --retry 6 \
            --retry-delay 10 \
            --retry-connrefused \
            --max-time 10 \
            "http://$web_ip/health"

          echo "Application health check passed."
