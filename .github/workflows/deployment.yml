name: Protected AWS Deployment

on:
  workflow_dispatch:
    inputs:
      app_image:
        description: Immutable ghcr.io image reference, such as a SHA-tagged image
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment configuration
        if: ${{ vars.AWS_ROLE_ARN == '' || vars.WEB_INSTANCE_ID == '' || vars.MONITORING_INSTANCE_ID == '' }}
        run: |
          echo "OIDC role and EC2 instance variables are not configured."
          exit 1
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Verify AWS identity
        run: aws sts get-caller-identity
      - name: Verify SSM access and instance registration
        env:
          WEB_INSTANCE_ID: ${{ vars.WEB_INSTANCE_ID }}
          MONITORING_INSTANCE_ID: ${{ vars.MONITORING_INSTANCE_ID }}
        run: |
          set -euo pipefail
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$WEB_INSTANCE_ID,$MONITORING_INSTANCE_ID" \
            --query "InstanceInformationList[].InstanceId" \
            --output text
      - name: Record requested immutable image
        env:
          APP_IMAGE: ${{ inputs.app_image }}
        run: |
          if [[ ! "$APP_IMAGE" =~ ^ghcr\.io/.+@sha256:[0-9a-f]{64}$ ]] &&
             [[ ! "$APP_IMAGE" =~ ^ghcr\.io/.+:[0-9a-f]{40,64}$ ]]; then
            echo "APP_IMAGE must be a GHCR digest or 40/64-character commit-SHA tag."
            exit 1
          fi
          echo "Requested image: $APP_IMAGE"
