global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  - job_name: "node_exporters"
    static_configs:
      - targets:
          - "{{ web_private_ip }}:9100"
          - "{{ monitoring_private_ip }}:9100"
        labels:
          environment: "portfolio"
