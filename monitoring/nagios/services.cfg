define service {
    use                     generic-service
    host_name               web-server,monitoring-server
    service_description     Ping
    check_command           check_ping!200.0,20%!500.0,50%
}

define service {
    use                     generic-service
    host_name               web-server
    service_description     Application HTTP
    check_command           check_http!-H {{ web_private_ip }} -p 80 -u /health
}

define service {
    use                     generic-service
    host_name               web-server
    service_description     Nginx Health
    check_command           check_http!-H {{ web_private_ip }} -p 80 -u /nginx-health
}

define service {
    use                     generic-service
    host_name               web-server,monitoring-server
    service_description     Node Exporter
    check_command           check_http!-p 9100 -u /metrics
}
